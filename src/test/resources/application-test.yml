# GagneFlow 测试环境配置 — 不依赖外部 Docker，使用 H2 内存数据库
# Spring profile: test (mvn test 时自动激活)

spring:
  datasource:
    url: jdbc:h2:mem:gagneflow_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    store-type: none  # 测试时不使用 Redis 会话

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

gagneflow:
  auth:
    jwt-secret: test-secret-key-32-bytes-long-for-unit-tests
  rate-limit:
    enabled: false  # 集成测试中关闭限流，避免 429 干扰

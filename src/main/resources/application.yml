server:
  port: ${SERVER_PORT:9900}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# CORS 跨域白名单（生产环境改为具体域名）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9900,http://localhost:5173}

# =============================================================================
# 会话分级记忆配置
# =============================================================================
gagneflow:
  session:
    max-idle: 24h
  memory:
    max-history-tokens: 3000
    max-window-tokens: 2000
    max-summary-tokens: 500
    summary-trigger-pairs: 5
    summary-interval-pairs: 3
    # LTM 冲突裁决 LLM 兜底(2026-08-10): 默认开启, 仅对规则拿不准的案例(sim 0.75~0.95 且同来源权重)调用 qwen-turbo,
    # 集成测试已真实验证裁决链路(保留新事实/保留旧事实/不冲突), 异常自动回退规则不悬挂
    conflict-llm-enabled: ${LTM_CONFLICT_LLM_ENABLED:true}
    conflict-llm-model: ${LTM_CONFLICT_LLM_MODEL:qwen-turbo}
  k12:
    path: lesson-plan-docs/k12_curriculum.json
  # =============================================================================
  # 对话多 Agent 编排(阶段一: supervisor 编排壳, 默认 single 零行为变化)
  #   single       : 现有单 ReactAgent 路径(默认)
  #   orchestrated : supervisor 规划 -> (检索) -> 执行 -> 复核 的轻量编排路径
  # 转正指标(灰度窗口 4 周, 达标后移除 single 双路径):
  #   1) orchestrated 模式整体 token 净节省 >= 10% (vs 同期 all-single 基线, 按 TokenCounter 估算)
  #   2) 延迟增幅 <= 20% (P95 端到端, 不含流式首字节优化迭代引入的方差)
  #   3) 复核检出率 > 0 (REVIEW 至少拦截 1 次 FAIL 回溯/周) 且无新增 P0/P1
  # 阶段一明确不接 checkpoint(断点续答为后续需求)
  agent:
    mode: ${GAGNEFLOW_AGENT_MODE:single}
    prompt-dir: ${GAGNEFLOW_AGENT_PROMPT_DIR:agent-config/prompts/v1}
  pdf:
    # 中文字体路径(2026-08-18): Docker 镜像内为 /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc,
    # 本地留空则走 addChineseFonts 硬编码路径(Windows/macOS/Linux 自动探测)
    font-path: ${GAGNEFLOW_PDF_FONT_PATH:}
  auth:
    jwt-secret: ${JWT_SECRET}  # P0修复: 强制从环境变量读取，移除不安全默认值
  pool:
    core-size: 10
    max-size: 50
    queue-capacity: 200
  lesson-plan:
    addrf-enabled: true
    k12-index-enabled: ${K12_INDEX_ENABLED:false}  # 已退役: 知识库由课标原文(curriculum_2022)接管, 默认不再灌自建知识点
  lesson:
    # 教案长驻存档: 最近教案 HTML 在 Redis 的保留天数(供对话 agent 检索"上次的教案")
    archive-ttl-days: ${LESSON_ARCHIVE_TTL_DAYS:7}
  # 记忆反哺: 用户偏好(LTM)注入 Design/Development/Review 阶段(2026-08-17)
  personalization:
    enabled: ${PERSONALIZATION_ENABLED:true}
    top-k: 3
  addrf:
    # Analysis 前置意图理解 + 澄清问题(2026-08-18 一期): 建议式推送不阻塞
    analysis-clarify-enabled: ${ADDRF_CLARIFY_ENABLED:true}
    # 2026-08-19 二期: 澄清等待用户回答的窗口(秒), 超时降级不阻塞
    # 2026-08-31: 默认 45->90(真实用户打字/思考需要时间; 与 @Value 默认同步)
    clarify-wait-seconds: ${ADDRF_CLARIFY_WAIT_SECONDS:90}
    # 2026-08-31: copilot 阶段确认等待(秒), 由硬编码 120s 提为可配默认 180s
    # (需与前端 CopilotConfirm.AWAIT_TIMEOUT_SEC 保持同步)
    await-timeout-seconds: ${ADDRF_AWAIT_TIMEOUT_SECONDS:180}
    # =============================================================================
    # 超时完整度改进 v2(双层计时 + 部分保留 + 断点续写)
    #   双层计时: L1 gap(45s, chunk 间隔挂死检测) + L2 总预算(Flux.take, 优雅截断保留 partial)
    #   决策树: 续写优先(无感修复) -> 续写失败按长度分流(≥300 字截断交付/过短重调)
    #   truncated 交付: 黄色非阻断提示(不走 HITL 强制确认), 可评分, 永不回灌
    # =============================================================================
    # L1 挂死检测: chunk 间隔超此值即判挂死(原单层 180s timeout 实为间隔语义, 降为 45s 更快响应)
    gap-timeout-sec: ${ADDRF_GAP_TIMEOUT_SEC:45}
    # 续写预算(秒): 固定值不可动态算 — development 180+45=225 < 240 future 硬顶, 留 15s 给 Format
    continue-budget-seconds: ${ADDRF_CONTINUE_BUDGET_SEC:45}
    # 续写失败后部分保留的最小字数(低于此值重调; 非"是否续写"的判定)
    partial-keep-chars: ${ADDRF_PARTIAL_KEEP_CHARS:300}
    # 总开关: false 时超时行为完全回退旧版(流超时->从零重调), 一键回滚
    timeout-partial-keep: ${ADDRF_TIMEOUT_PARTIAL_KEEP:true}
    # Analysis 结果缓存 TTL(小时), 1h -> 6h 减少重复 LLM 调用
    analysis-cache-ttl-hours: ${ADDRF_ANALYSIS_CACHE_TTL_HOURS:6}
    # 2026-08-19: 反哺综合分权重 — 用户评分占比(0-1), LLM 分占比 = 1-weight
    # 个人教案库(user_id 隔离)场景用户认可应参与入库决策; 未评分时仍用 LLM 分兜底
    feedback-user-weight: ${ADDRF_FEEDBACK_USER_WEIGHT:0.6}
  pipeline:
    # ADDRF 流水线阶段顺序（可增删调序）
    stages:
      - analysis
      - design
      - development
      - review
      - format
  token-counter:
    # 启动时调用 DashScope tokenizer API 校准字符→token 倍率
    calibrate: true
  # R3: Prompt 版本管理
  prompts:
    path: agent-config/prompts
  prompt:
    experiment:
      enabled: false
      splits: {}

# =============================================================================
# Redis: 会话持久化 + 缓存中间层
# =============================================================================
spring:
  security:
    filter:
      # 仅 REQUEST + ERROR 经过安全过滤器，ASYNC 分发跳过
      # SSE 流式响应在初次 REQUEST 中已完成鉴权，异步写入不需要重复校验
      dispatcher-types: request, error
  datasource:
    # DB 连接由环境变量注入(支持本地/容器/生产远程), 无硬编码 localhost
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gagneflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    # L6修复: 已移除默认值，生产环境必须通过环境变量设置
    # 本地开发请使用 dev profile: --spring.profiles.active=dev 或在 IDE 中设置
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: gagneflow:session
      flush-mode: on_save
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

    mcp:
      client:
        # 显式禁用 MCP client，避免未配置可用端点时（如 .env 误设 MCP_ENABLED=true）
        # 启动连接外部 MCP 服务导致 20s 超时 Bean 创建失败；需要时再按需开启
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: ${MCP_CLS_SSE_ENDPOINT:/sse/placeholder}

# =============================================================================
# 文件上传
# =============================================================================
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-extensions: ${FILE_UPLOAD_ALLOWED_EXTENSIONS:txt,md,pdf,docx}

# =============================================================================
# Actuator 健康检查
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  simple:
    metrics:
      export:
        enabled: true

# =============================================================================
# Swagger/OpenAPI 文档
# =============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# =============================================================================
# Resilience4j 熔断器
# =============================================================================
resilience4j:
  circuitbreaker:
    instances:
      milvus:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      dashscope:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s

# =============================================================================
# Milvus 向量数据库
# =============================================================================
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}
  timeout: 10000
  # 2026-08-19: 反哺教案独立个人库 collection 名(可配)
  personal-plans-collection: ${MILVUS_PERSONAL_PLANS_COLLECTION:personal_plans}
  # 反哺教案入库/检索统一质量门槛 (2026-08-27: 原回灌70 vs 检索85 魔法数漂移, 统一收敛可配)
  lesson-plan-min-score: ${MILVUS_LESSON_PLAN_MIN_SCORE:85}
  search:
    nprobe: ${MILVUS_NPROBE:16}
    nprobe-max: ${MILVUS_NPROBE_MAX:64}
    nprobe-adaptive: true

# =============================================================================
# 阿里云 DashScope 配置
# 注: API Key 已统一使用 spring.ai.dashscope.api-key 路径
# =============================================================================
dashscope:
  embedding:
    model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
  rerank:
    # gte-rerank 已于 2026-05-30 下线（返回 403），改用 qwen3-rerank
    model: ${DASHSCOPE_RERANK_MODEL:qwen3-rerank}
    top-n: ${DASHSCOPE_RERANK_TOP_N:3}
    search-top-k: ${DASHSCOPE_RERANK_SEARCH_TOP_K:30}  # K15->30: 实测义务 Hit@3 +10pp(2026-08-09 A组实验)
  summary:
    model: ${DASHSCOPE_SUMMARY_MODEL:qwen-plus}

# =============================================================================
# 文档分片 & RAG 配置
# =============================================================================
document:
  chunk:
    max-size: ${DOCUMENT_CHUNK_MAX_SIZE:800}
    overlap: ${DOCUMENT_CHUNK_OVERLAP:160}

rag:
  model: ${RAG_MODEL:qwen-max-latest}
  relevance-threshold: ${RAG_RELEVANCE_THRESHOLD:0.3}
  query-rewrite:
    enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
    # L4修复: LLM 查询改写 — 2026-08-08 实测开启: 上下文依赖查询(指代/省略) HitRate@3 40%->55%、MRR@3 0.45->0.60(+15pp), 独立查询无影响(42.5% vs 45%)
    llm-enabled: ${RAG_QUERY_REWRITE_LLM_ENABLED:true}
    llm-model: ${RAG_QUERY_REWRITE_LLM_MODEL:qwen-turbo}
    model: ${RAG_QUERY_REWRITE_MODEL:qwen-plus}
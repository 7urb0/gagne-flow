name: GagneFlow CI

on:
  push:
    branches: [ master, develop, "feature/**", "fix/**" ]
  pull_request:
    branches: [ master, develop ]

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Checkstyle
        run: mvn checkstyle:check -Dcheckstyle.failOnViolation=true

  unit-test:
    name: Unit Tests
    needs: checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn test -Dspring.profiles.active=test
      - name: Generate JaCoCo Report
        run: mvn jacoco:report
      - name: Check Coverage Threshold
        run: |
          mvn jacoco:check -Djacoco.haltOnFailure=false || echo "Coverage below threshold"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  build:
    name: Build
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Package
        run: mvn package -DskipTests
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gagneflow-jar
          path: target/*.jar

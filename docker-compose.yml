# =============================================================================
# GagneFlow — 一键部署配置
# 启动: docker compose up -d
# 停止: docker compose down
# 数据: MySQL 挂载本地 ./volumes/mysql(bind mount, 保留历史数据);
#       Redis/Milvus 系使用命名卷(数据可重建)。
# 2026-08-16 迁移审查修正:
#   - MySQL 从命名卷改为 bind mount ./volumes/mysql, 修复与历史数据脱节问题
#   - MYSQL_PASSWORD 走环境变量, 移除硬编码
#   - MinIO 凭证字段更新为 MINIO_ROOT_USER/PASSWORD(旧字段已弃用)
#   - 容器命名统一 gagneflow- 前缀
# =============================================================================
services:

  # ===========================================================================
  # MySQL 8.0 — 主数据库（教案、用户、会话消息、LTM 事实）
  # ===========================================================================
  mysql:
    container_name: gagneflow-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gagneflow123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gagneflow}
      MYSQL_USER: ${MYSQL_USER:-gagneflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gagneflow123}
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis 7 — 会话存储 + 缓存 + 限流 + 分布式锁
  # ===========================================================================
  redis:
    container_name: gagneflow-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # Milvus 向量数据库 — 依赖 etcd (元数据) + MinIO (对象存储)
  # ===========================================================================
  etcd:
    container_name: gagneflow-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: gagneflow-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: gagneflow-milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ===========================================================================
  # Attu — Milvus 可视化管理界面 (http://localhost:8000)
  # ===========================================================================
  attu:
    container_name: gagneflow-milvus-attu
    image: zilliz/attu:v2.5
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus

volumes:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
